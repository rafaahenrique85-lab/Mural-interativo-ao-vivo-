<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PixWall</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="logo">

            <img src="assets/icons/logo.png" id="logoPixwall" alt="PixWall">

            <h1>PIXWALL</h1>

        </div>

    </header>

    <main class="container">

        <!-- QR Code -->
        <aside class="colunaEsquerda">

            <div class="qrArea">

                <img src="qr.png" id="qrcode" alt="QR Code">

                <p>ESCANEIE PARA ENVIAR SUA FOTO</p>

            </div>

        </aside>

        <!-- Foto principal -->
        <section class="mural">

            <img id="fotoPrincipal" src="" alt="Foto Principal">

            <div id="novo" class="novo">
                🔥 NOVA FOTO
            </div>

        </section>

        <!-- Miniaturas -->
        <aside class="colunaDireita">

            <div id="miniaturasDireita" class="miniaturas"></div>

        </aside>

    </main>

    <footer>

        PixWall Studio • Desenvolvido por Henrique Fotografias

    </footer>

    <script src="script.js"></script>

</body>

</html>
