<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PixWall</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="logo">

            <img src="assets/icons/logo.png" id="logoPixwall" alt="PixWall">

            <h1>PIXWALL</h1>

        </div>

    </header>

    <main class="container">

 <!-- Foto principal -->
    <section class="mural">

    <div class="qrArea">

        <img src="qr.png" id="qrcode" alt="QR Code">

        <p>ESCANEIE PARA ENVIAR SUA FOTO</p>

    </div>

    <div id="telaEspera" class="tela-espera">

        <div class="marca-fundo">PIXWALL</div>

        <div class="mensagem-espera">
            <h2>O melhor do evento é compartilhar.</h2>
            <p>Escaneie o QR Code e envie sua foto.</p>
        </div>

    </div>

    <img id="fotoA" class="foto-ativa" src="" alt="Foto A">

    <img id="fotoB" class="foto-inativa" src="" alt="Foto B">

    <div id="novo" class="novo">
        🔥 NOVA FOTO
    </div>

</section>

    </main>

    <footer>

        PixWall Studio • Desenvolvido por Henrique Fotografias

    </footer>

    <button id="btnTelaCheia" class="btn-tela-cheia">
    ⛶ Tela Cheia
</button>

<script src="script.js"></script>

</body>

</html>
