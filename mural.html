<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PixWall</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">
        <h1>PIXWALL</h1>
    </div>

</header>

<main class="container">

    <section class="mural">

        <!-- Nome do Evento -->
        <div id="nomeEvento" class="nome-evento"></div>

        <!-- QR Code -->
        <div class="qrArea">

            <img src="/assets/icons/qrcode.png" id="qrcode" alt="QR Code">

            <p>ESCANEIE O QR CODE E ENVIE SUA FOTO</p>

        </div>

        <!-- Tela de Espera -->
        <div id="telaEspera" class="tela-espera">

            <div class="marca-fundo">PIXWALL</div>

            <div class="mensagem-espera">

                <h2>O melhor do evento é compartilhar.</h2>

                <p>ESCANEIE O QR CODE E ENVIE SUA FOTO</p>

            </div>

        </div>

        <!-- Fotos -->
        <img id="fotoA" class="foto-ativa" src="" alt="Foto A">

        <img id="fotoB" class="foto-inativa" src="" alt="Foto B">

        <!-- Nova Foto -->
        <div id="novo" class="novo">
            🔥 NOVA FOTO
        </div>

    </section>

</main>

<footer>
    PixWall Studio • Desenvolvido por Henrique Fotografias • v1.0.0
</footer>

<button id="btnTelaCheia" class="btn-tela-cheia">
    ⛶ Tela Cheia
</button>

<script src="script.js"></script>

</body>

</html>
