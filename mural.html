<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PixWall - Mural</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topo">

    <div class="logo">

        <img src="assets/icons/logo.png" alt="PixWall">

        <h1>PIXWALL</h1>

    </div>

</header>

<main class="layout">

    <aside class="lateral">

        <div id="miniaturas-esquerda"></div>

    </aside>

    <section class="principal">

        <img id="fotoPrincipal" src="" alt="Foto">

        <div id="novo" class="novo">
            🔥 NOVA FOTO
        </div>

    </section>

    <aside class="lateral">

        <div id="miniaturas-direita"></div>

    </aside>

    <aside class="qr">

        <h2>ESCANEIE</h2>

        <p>Envie sua foto para aparecer no mural.</p>

        <img src="qr.png" id="qrcode">

    </aside>

</main>

<footer>

PixWall Studio • Desenvolvido por Henrique Fotografias

</footer>

<script src="mural.js"></script>

</body>

</html>
