<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - PixWall</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="container">

        <h1>PixWall</h1>
        <h2>Painel Administrativo</h2>

        <div class="card" id="cardEvento">

    <h3>Evento Atual</h3>

    <p id="eventoNome">Nenhum evento ativo</p>

    <p id="eventoModo"></p>

    <p id="eventoTempo"></p>

    <div id="acoesEvento" style="display:none; margin-top:20px;">

    <button id="btnEditarEvento">✏️ Editar Evento</button>

    <button id="btnEncerrarEvento">🛑 Encerrar Evento</button>

</div>
</div>

        <div class="card">

    <button id="btnCriarEvento">➕ Criar Evento</button>

    <div id="formEvento" style="display:none; margin-top:20px;">

        <h3>Novo Evento</h3>

        <input type="text" id="nomeEvento" placeholder="Nome do evento">

        <br><br>

        <label>
            <input type="radio" name="aprovacao" value="automatico" checked>
            Automático
        </label>

        <label style="margin-left:20px;">
            <input type="radio" name="aprovacao" value="manual">
            Manual
        </label>

        <br><br>

        <label>Tempo de exibição</label>

        <br>

        <input type="number" id="tempoEvento" value="8" min="3">

        <br><br>

        <button id="btnSalvarEvento">Salvar Evento</button>

    </div>

    <button id="btnAbrirMural">🖥️ Abrir Mural</button>
<button id="btnPaginaEnvio">📷 Página de Envio</button>
<button>⚙️ Configurações</button>

</div>

<div class="card">
    <h3>📸 Fotos Pendentes</h3>

    <div id="listaPendentes">
        <p>Nenhuma foto aguardando aprovação.</p>
    </div>
</div>

<div class="card">
    <h3>Status</h3>

            <p class="status">🟢 Servidor Online</p>

            <br>

            <p>Fotos recebidas: 0</p>

            <br>

            <p>Tempo de exibição: 8 segundos</p>
        </div>

        <footer>
    PixWall © 2026
</footer>

</div>

<script src="admin.js"></script>

</body>
</html>
