<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixWall</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">

    <div class="logo">
        <img src="assets/icons/logo.png" alt="PixWall">
        <h1>PIXWALL</h1>
    </div>

    <div class="evento">
        <span id="nomeEvento">Meu Evento</span>
    </div>

</header>

<main class="principal">

    <section class="centro">

        <div class="foto">

            <img id="fotoA" class="foto-ativa" src="" alt="Foto A">

            <img id="fotoB" class="foto-inativa" src="" alt="Foto B">

            <div id="novo" class="novo">
                📸 NOVA FOTO
            </div>

        </div>

    </section>

</main>

<footer class="rodape">

    <div class="qrArea">

        <img id="qrcode" src="qr.png" alt="QR Code">

        <div class="textoQR">
            ESCANEIE PARA ENVIAR SUA FOTO
        </div>

    </div>

    <div class="rodapeCentro">
        © PixWall • Desenvolvido por Henrique Fotografias
    </div>

</footer>

<script src="script.js"></script>

</body>
</html>
