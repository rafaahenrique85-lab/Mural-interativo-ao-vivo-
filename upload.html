<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixWall - Upload</title>

    <link rel="stylesheet" href="upload.css">
</head>

<body>

<div class="container">

    <h2>Enviar foto para o PixWall</h2>

    <p>Escolha uma foto do seu celular ou computador.</p>

    <form id="formUpload">

        <input type="file" id="foto" name="foto" required>

        <button type="submit">
            Enviar Foto
        </button>

    </form>

    <div class="mensagem" id="mensagem"></div>

</div>

<script src="upload.js"></script>

</body>
</html>
