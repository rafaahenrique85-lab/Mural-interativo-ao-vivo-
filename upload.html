<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixWall - Upload</title>

    <link rel="stylesheet" href="upload.css">
</head>

<body>

    <div class="container">

        <div class="logo">
            <h1>PIXWALL</h1>
        </div>

        <div class="texto">
            <h2>O melhor do evento é compartilhar</h2>
        </div>

        <form id="formUpload">

            <input
                type="file"
                id="foto"
                name="foto"
                accept="image/*"
                required>

            <label for="foto" class="botaoSelecionar">
                ENVIAR MINHA FOTO
            </label>

        </form>

        <div class="progresso">
            <progress id="barraProgresso" value="0" max="100"></progress>
            <span id="percentual">0%</span>
        </div>

        <div class="mensagem" id="mensagem"></div>

        <div class="termos">
            Ao enviar sua foto, você concorda com os
            <strong>Termos de Uso</strong> e a
            <strong>Política de Privacidade</strong>.
        </div>

    </div>

    <script src="upload.js"></script>

</body>

</html>
