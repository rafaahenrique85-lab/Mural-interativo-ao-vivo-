<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enviar Fotos • PixWall</title>

    <link rel="stylesheet" href="upload.css">

</head>

<body>

<div class="container">

    <div class="logo">

        <img src="assets/icons/logo.png" alt="PixWall">

        <h1>PIXWALL</h1>

    </div>

    <h2>Compartilhe seus melhores momentos</h2>

    <p>
        Escolha suas fotos e envie para aparecerem
        no telão em instantes.
    </p>

    <label for="fotos" class="botaoSelecionar">
        📷 Selecionar Fotos
    </label>

    <input
        type="file"
        id="fotos"
        multiple
        accept="image/*">

    <button id="enviar">
        Enviar Fotos
    </button>

    <div id="mensagem" class="mensagem">

        ✅ Suas fotos foram enviadas com sucesso!

    </div>

</div>

<script src="upload.js"></script>

</body>

</html>
